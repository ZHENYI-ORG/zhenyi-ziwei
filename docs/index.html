<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>真一紫微 · 紫微斗数排盘</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;700&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────── */
:root {
  --paper: #f2f0f5;
  --sheet: #fbfafd;
  --sheet-2: #f6f3f9;
  --ink: #231a31;
  --ink-2: #584d67;
  --ink-3: #8b8199;
  --line: #d8d1e2;
  --line-2: #b9aecb;
  --zi: #5a2a8c;
  --zi-soft: #ebe3f5;
  --zi-faint: rgba(90, 42, 140, .07);
  --zhu: #a83a2f;
  --lu: #1d7a4b;
  --quan: #a4520d;
  --ke: #1f5ea7;
  --ji: #b3302a;
  --gold: #8a6a22;
  --ghost: rgba(90, 42, 140, .085);
  --shadow: 0 1px 0 rgba(35, 26, 49, .04), 0 10px 30px -18px rgba(35, 26, 49, .35);
  --f-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif CJK SC", serif;
  --f-text: "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14111b; --sheet: #1c1726; --sheet-2: #211b2c; --ink: #ede7f6; --ink-2: #b9aecb; --ink-3: #8a7f9c;
    --line: #342c42; --line-2: #4c4260; --zi: #c3a1f4; --zi-soft: #2c2241; --zi-faint: rgba(195, 161, 244, .08);
    --zhu: #f08070; --lu: #5fc896; --quan: #eda55e; --ke: #7cb1f4; --ji: #f2776a; --gold: #d8b96c;
    --ghost: rgba(195, 161, 244, .07); --shadow: 0 1px 0 rgba(0,0,0,.2), 0 14px 34px -20px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14111b; --sheet: #1c1726; --sheet-2: #211b2c; --ink: #ede7f6; --ink-2: #b9aecb; --ink-3: #8a7f9c;
  --line: #342c42; --line-2: #4c4260; --zi: #c3a1f4; --zi-soft: #2c2241; --zi-faint: rgba(195, 161, 244, .08);
  --zhu: #f08070; --lu: #5fc896; --quan: #eda55e; --ke: #7cb1f4; --ji: #f2776a; --gold: #d8b96c;
  --ghost: rgba(195, 161, 244, .07); --shadow: 0 1px 0 rgba(0,0,0,.2), 0 14px 34px -20px rgba(0,0,0,.8);
  color-scheme: dark;
}

/* ── base ─────────────────────────────────────────── */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--zi); outline-offset: 2px; border-radius: 3px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ── header ─────────────────────────────────────────── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--paper); }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.brand-mark { font-family: var(--f-brush); font-size: 34px; line-height: 1; color: var(--zi); letter-spacing: .02em; white-space: nowrap; }
.brand-sub { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-2); color: var(--ink); }

/* ── stage layout ─────────────────────────────────────── */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); gap: clamp(18px, 2.4vw, 32px); padding: clamp(14px, 2.4vw, 28px) clamp(16px, 3vw, 36px) 48px; max-width: 1360px; margin: 0 auto; align-items: start; }
.board-col { min-width: 0; }
@media (max-width: 1080px) { .stage { grid-template-columns: minmax(0, 1fr); } }

#board, #reading, #mobileFormSlot { scroll-margin-top: 72px; }
/* ── board ─────────────────────────────────────────── */
.board { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr));
  grid-template-areas: "p5 p6 p7 p8" "p4 c c p9" "p3 c c p10" "p2 p1 p0 p11";
  aspect-ratio: 1 / 1.04; width: 100%; max-width: 820px; margin: 0 auto; border: 1px solid var(--line-2); background: var(--line); gap: 1px; box-shadow: var(--shadow); }
.palace { position: relative; background: var(--sheet); padding: 6px 6px 4px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; cursor: pointer; transition: background-color .2s; }
.palace:hover { background: var(--sheet-2); }
.palace.sf { background: var(--zi-soft); }
.palace.sel { box-shadow: inset 0 0 0 2px var(--zi); }
.palace .ghost { position: absolute; right: 4px; bottom: -6px; font-family: var(--f-brush); font-size: clamp(42px, 7vw, 88px); line-height: 1; color: var(--ghost); pointer-events: none; user-select: none; }
.board.filled .palace .ghost { font-size: clamp(30px, 4.6vw, 56px); bottom: 14px; }

.stars { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 3px; position: relative; z-index: 1; }
.st { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.12; font-size: 12px; color: var(--ink); }
.st b { font-weight: 500; display: block; }
.st i { font-style: normal; font-size: 10px; color: var(--ink-3); margin-top: 1px; }
.st.major { font-size: 15px; color: var(--zi); }
.st.major b { font-weight: 700; }
.st.major i.hi { color: var(--gold); }
.st.lu { color: var(--lu); }
.st.lucky { color: var(--ke); }
.st.sha { color: var(--zhu); }
.st.minor { color: var(--ink-3); font-size: 11px; }
.hua { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-top: 2px; border-radius: 3px; font-style: normal; font-size: 10.5px; font-weight: 700; color: #fff; line-height: 1; }
.hua.禄 { background: var(--lu); } .hua.权 { background: var(--quan); } .hua.科 { background: var(--ke); } .hua.忌 { background: var(--ji); }
:root[data-theme="dark"] .hua, :root:not([data-theme="light"]) .hua { color: #fff; }
.fhua { display: block; font-style: normal; font-size: 9.5px; line-height: 1.2; margin-top: 1px; padding: 0 2px; border-radius: 2px; border: 1px solid currentColor; }
.fhua.禄 { color: var(--lu); } .fhua.权 { color: var(--quan); } .fhua.科 { color: var(--ke); } .fhua.忌 { color: var(--ji); }

.minors { margin-top: auto; position: relative; z-index: 1; font-size: 10.5px; line-height: 1.35; color: var(--ink-3); padding-top: 3px; }
.minors span { margin-right: 4px; white-space: nowrap; }
.flows { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
.flows span { font-size: 10px; line-height: 1.3; padding: 0 3px; border-radius: 2px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.flows span.decade { border-color: var(--zi); color: var(--zi); }
.flows span.year { border-color: var(--gold); color: var(--gold); }
.flows span.bad { background: var(--zi-faint); }

.foot { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 2px; margin-top: 4px; padding-top: 3px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--ink-2); }
.foot .dx { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.foot .dx.now { color: var(--zi); font-weight: 700; }
.foot .pname { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.palace.ming .foot .pname { color: var(--zi); }
.foot .pname .shen { display: inline-block; margin-left: 3px; padding: 0 3px; border-radius: 3px; background: var(--zi); color: var(--sheet); font-size: 11px; line-height: 1.4; vertical-align: 1px; }
.foot .gz { text-align: right; white-space: nowrap; }
.extra { position: relative; z-index: 1; display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); line-height: 1.3; }
.tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
.tags span { font-size: 10.5px; line-height: 1.25; padding: 0 4px; border-radius: 2px; font-weight: 700; color: #fff; }
.tags .decade { background: var(--zi); } .tags .year { background: var(--gold); } .tags .month { background: var(--ke); } .tags .day { background: var(--lu); }
:root[data-theme="dark"] .tags span, :root:not([data-theme="light"]) .tags span { color: #14111b; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .tags span, :root:not([data-theme="dark"]) .hua { color: #fff; } }
:root[data-theme="light"] .tags span, :root[data-theme="light"] .hua { color: #fff; }

/* 起盘动效：自命宫逆时针依次落星 */
.board.reveal .palace .stars, .board.reveal .palace .minors, .board.reveal .palace .foot { animation: drop .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 55ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .board.reveal .palace * { animation: none !important; } }

/* center */
.heart { grid-area: c; background: var(--sheet); position: relative; padding: clamp(10px, 1.6vw, 20px); display: flex; flex-direction: column; min-width: 0; overflow: auto; }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.lines line { stroke: var(--zi); stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: .4; }
.lines line.opp { stroke-dasharray: 4 3; }
.lines line.jichong { stroke: var(--ji); stroke-dasharray: 2 3; opacity: .7; }
.lines circle { fill: var(--zi); }

/* ── form ─────────────────────────────────────────── */
.birth { display: grid; gap: 9px; }
.birth h1 { margin: 0 0 2px; font-family: var(--f-brush); font-weight: 400; font-size: clamp(26px, 3vw, 34px); line-height: 1.1; color: var(--zi); }
.birth .lede { margin: -4px 0 4px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > label.k { flex: 0 0 3.2em; font-size: 13px; color: var(--ink-2); }
.field { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--line-2); background: var(--paper); border-radius: 6px; padding: 0 9px; font-size: 14px; }
select.field { padding-right: 4px; }
.field:focus { border-color: var(--zi); outline: none; box-shadow: 0 0 0 3px var(--zi-faint); }
.trio { flex: 1; display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 6px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; flex: 0 0 auto; }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 32px; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--zi); color: var(--sheet); }
.row .hint { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.checkline { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); }
.lon-note { font-size: 12px; color: var(--ink-3); margin: -4px 0 0 calc(3.2em + 8px); min-height: 1em; }
.link { background: none; border: 0; padding: 0; color: var(--zi); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
.go { height: 42px; border: 0; border-radius: 6px; background: var(--zi); color: var(--sheet); font-size: 16px; letter-spacing: .3em; font-weight: 700; margin-top: 2px; }
.go:hover { filter: brightness(1.08); }
.form-err { color: var(--ji); font-size: 13px; min-height: 0; margin: 0; }

/* heart info */
.who { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.who strong { font-family: var(--f-brush); font-weight: 400; font-size: clamp(24px, 3vw, 34px); color: var(--zi); line-height: 1.1; }
.who span { font-size: 13px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 8px; font-size: 13px; }
.facts dt { color: var(--ink-3); white-space: nowrap; }
.facts dd { margin: 0; color: var(--ink); min-width: 0; }
.facts dd small { color: var(--ink-3); font-size: 11.5px; }
.pillars { letter-spacing: .12em; font-weight: 700; }
.heart-actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
.ghost-btn { border: 1px solid var(--line-2); background: transparent; border-radius: 5px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.ghost-btn:hover { color: var(--zi); border-color: var(--zi); }
.heart-empty { margin: auto; text-align: center; color: var(--ink-3); }
.heart-empty .mk { font-family: var(--f-brush); font-size: clamp(40px, 7vw, 64px); color: var(--zi); line-height: 1.1; }

/* notices */
.notices { max-width: 820px; margin: 12px auto 0; display: grid; gap: 6px; }
.notice { font-size: 13px; color: var(--ink-2); padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--sheet); border-radius: 0 6px 6px 0; }
.notice .alt { margin-left: 6px; }

/* ── timeline ─────────────────────────────────────────── */
.timeline { max-width: 820px; margin: 14px auto 0; display: grid; gap: 6px; }
.tl-row { display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 8px; }
.tl-row > span { font-size: 13px; color: var(--ink-3); }
.chips { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 3px 9px; font-size: 12.5px; line-height: 1.35; color: var(--ink-2); text-align: center; }
.chip small { display: block; font-size: 10.5px; color: var(--ink-3); }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.now { border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--zi); border-color: var(--zi); color: var(--sheet); }
.chip[aria-pressed="true"] small { color: var(--sheet); opacity: .8; }
.view-toggles { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }

/* ── reading panel ─────────────────────────────────────── */
.reading { position: sticky; top: 76px; max-height: calc(100vh - 92px); display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; min-width: 0; box-shadow: var(--shadow); }
@media (max-width: 1080px) { .reading { position: static; max-height: none; } }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; }
.tab { border: 0; background: transparent; padding: 8px 10px 9px; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--zi); border-bottom-color: var(--zi); font-weight: 700; }
.panel { padding: 16px 18px 22px; overflow-y: auto; flex: 1 1 auto; }
.panel h2 { font-size: 18px; margin: 0 0 6px; line-height: 1.4; }
.panel h3 { font-size: 15px; margin: 18px 0 6px; color: var(--zi); }
.panel p { margin: 0 0 10px; }
.panel .muted { color: var(--ink-3); font-size: 13px; }
.lead { font-size: 15.5px; line-height: 1.85; }
.kv { display: grid; grid-template-columns: 5.2em 1fr; gap: 6px 12px; margin: 8px 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.keys span { font-size: 12.5px; padding: 1px 8px; border-radius: 999px; background: var(--zi-soft); color: var(--zi); }
.hua-card { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.hua-card:first-of-type { border-top: 0; }
.hua-card .hua { width: 26px; height: 26px; font-size: 15px; margin: 2px 0 0; border-radius: 5px; }
.hua-card h4 { margin: 0; font-size: 14.5px; }
.hua-card p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.hua-card .clash { color: var(--ji); font-size: 13px; }
.pat { padding: 10px 0 12px; border-top: 1px solid var(--line); }
.pat:first-child { border-top: 0; }
.pat-head { display: flex; align-items: baseline; gap: 8px; }
.pat-head h4 { margin: 0; font-size: 15.5px; }
.lvl { font-size: 11.5px; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.lvl.excellent { color: var(--gold); } .lvl.good { color: var(--lu); } .lvl.neutral { color: var(--ink-3); } .lvl.caution { color: var(--ji); }
.pat p { margin: 4px 0 4px; font-size: 14px; color: var(--ink-2); }
.cond { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.cond b { font-weight: 600; color: var(--ink-2); }
.cond .brk { color: var(--ji); }
.src { font-size: 12px; color: var(--ink-3); }
.pat-sum { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
.tone { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid currentColor; }
.tone.顺 { color: var(--lu); } .tone.平 { color: var(--ink-3); } .tone.慎 { color: var(--ji); }
.lines-list { margin: 0; padding-left: 1.1em; }
.lines-list li { margin: 0 0 6px; }
.principle { padding: 10px 0; border-top: 1px solid var(--line); }
.principle:first-of-type { border-top: 0; }
.principle h4 { margin: 0 0 2px; font-size: 14.5px; color: var(--zi); }
.principle p { margin: 0; font-size: 14px; color: var(--ink-2); }
.disclaimer { font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; }
.sf-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.sf-mini div { border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 12.5px; text-align: center; }
.sf-mini b { display: block; font-size: 13px; color: var(--zi); }

/* AI */
.ai-out { font-size: 15px; line-height: 1.9; }
.ai-out h2 { font-size: 16.5px; color: var(--zi); margin: 18px 0 6px; }
.ai-out h3 { font-size: 15px; margin: 14px 0 4px; }
.ai-out ul { padding-left: 1.2em; margin: 4px 0 10px; }
.ai-thinking { color: var(--ink-3); font-size: 14px; }
.ai-thinking::after { content: "…"; animation: blink 1.2s infinite steps(4); }
@keyframes blink { 50% { opacity: .2; } }
.ai-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.btn { border: 1px solid var(--zi); background: var(--zi); color: var(--sheet); border-radius: 6px; padding: 7px 16px; font-size: 14px; }
.btn.secondary { background: transparent; color: var(--zi); }
.btn:disabled { opacity: .5; cursor: default; }
.ask { display: flex; gap: 8px; margin-top: 10px; }
.ask .field { height: 38px; }
.qa { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
.qa .q { font-weight: 700; color: var(--ink); margin: 0 0 4px; }

/* dialogs */
dialog { border: 1px solid var(--line-2); border-radius: 12px; background: var(--sheet); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(20, 15, 28, .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 17px; }
.dlg-body { padding: 14px 18px 18px; overflow-y: auto; max-height: calc(100vh - 140px); }
.set { display: grid; grid-template-columns: 7em 1fr; gap: 10px 14px; align-items: center; margin-bottom: 14px; font-size: 14px; }
.set label { color: var(--ink-2); }
.set-note { font-size: 12.5px; color: var(--ink-3); margin: -6px 0 14px; }
.saved { list-style: none; margin: 0; padding: 0; }

<script>
/* ===== astro.js ===== */
/* ══════════════════════════════════════════════════════════════
 * Astro · 天文内核
 * 儒略日 / ΔT / VSOP87 截断太阳黄经 / Meeus 朔望 / 均时差 / 节气求解
 * 精度：太阳视黄经 ≈1″（节气时刻 ≈±30s），朔 ≈±20s
 * ══════════════════════════════════════════════════════════════ */
const Astro = (() => {
  const D2R = Math.PI / 180;
  const R2D = 180 / Math.PI;
  const norm360 = (x) => ((x % 360) + 360) % 360;
  const normPm180 = (x) => { const v = norm360(x); return v > 180 ? v - 360 : v; };

  /** 公历 → 儒略日（d 可带小数，UT 或 TT 取决于调用方） */
  function jd(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100);
    const B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }

  /** 儒略日 → 公历 {y,m,d(含小数)} */
  function fromJd(J) {
    const z = Math.floor(J + 0.5);
    const f = J + 0.5 - z;
    let A = z;
    if (z >= 2299161) {
      const a = Math.floor((z - 1867216.25) / 36524.25);
      A = z + 1 + a - Math.floor(a / 4);
    }

    const C = Math.floor((B - 122.1) / 365.25);

    const m = E < 14 ? E - 1 : E - 13;
    const y = m > 2 ? C - 4716 : C - 4715;
    return { y, m, d };

  /** ΔT = TT − UT（秒），Espenak & Meeus 多项式 */
  function deltaT(year) {

      [207.19, 0.121824, 0, 0.000042], [291.34, 1.844379, 0, 0.00004], [161.72, 24.198154, 0, 0.000037],
      [239.56, 25.513099, 0, 0.000035], [331.55, 3.592518, 0, 0.000023],
    ];
    for (const [a0, a1, a2, c] of A) JDE += c * Math.sin((a0 + a1 * k + a2 * T * T) * D2R);
    return JDE - dtDays(JDE);
  }
  /** 给定 UT 儒略日附近的朔序号 */
  const lunationNear = (J) => Math.round((J - 2451550.09766) / 29.530588861);

  /** 均时差（分钟）：真太阳时 − 平太阳时，J 为 UT 儒略日 */
  function equationOfTime(J) {
    const Jtt = J + dtDays(J);
    const T = (Jtt - 2451545) / 36525;
    const tau = T / 10;
    const L0m = norm360(280.4664567 + 360007.6982779 * tau + 0.03032028 * tau * tau + tau ** 3 / 49931 - tau ** 4 / 15300 - tau ** 5 / 2000000);

    const eps0 = 23.43929111 - 0.013004167 * T - 0.0000001639 * T * T + 0.0000005036 * T ** 3;
    const Om = (125.04452 - 1934.136261 * T) * D2R;
    const eps = (eps0 + 0.00256 * Math.cos(Om)) * D2R;
    const alpha = norm360(Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) * R2D);
    const Ls = (280.4665 + 36000.7698 * T) * D2R;
    const dPsi = (-17.20 * Math.sin(Om) - 1.32 * Math.sin(2 * Ls)) / 3600;
    const E = normPm180(L0m - 0.0057183 - alpha + dPsi * Math.cos(eps));
    return E * 4; // 度 → 分钟
  }

  return { jd, fromJd, deltaT, sunApparentLongitude, solarTermUT, termOfYear, TERM_NAMES, newMoonUT, lunationNear, equationOfTime, norm360 };
})();

    : ['初','十','廿','三'][Math.floor(d / 10)] + '一二三四五六七八九十'[(d - 1) % 10];
  const mod = (a, n) => ((a % n) + n) % n;

  const info = (y) => LUNAR_INFO[y - 1900];
  const leapMonth = (y) => info(y) & 0xf;
  const leapDays = (y) => leapMonth(y) ? ((info(y) & 0x10000) ? 30 : 29) : 0;
  const monthDays = (y, m) => (info(y) & (0x8000 >> (m - 1))) ? 30 : 29;
  function yearDays(y) { let s = 0; for (let m = 1; m <= 12; m++) s += monthDays(y, m); return s + leapDays(y); }

  /** 公历日期 → 整数儒略日（JDN） */
  const jdn = (y, m, d) => Math.round(Astro.jd(y, m, d) + 0.5);
  function fromJdn(n) { const r = Astro.fromJd(n - 0.5); return { y: r.y, m: r.m, d: Math.round(r.d) }; }

  function isValidSolar(y, m, d) {
    if (y < 1900 || y > 2100 || m < 1 || m > 12 || d < 1) return false;
    const r = fromJdn(jdn(y, m, d));
    return r.y === y && r.m === m && r.d === d && jdn(y, m, d) >= BASE_JDN;
  }

  /** 公历 → 农历 */
  function solarToLunar(y, m, d) {
    let off = jdn(y, m, d) - BASE_JDN;

    let ly = 1900;
    for (; ly <= 2100; ly++) { const n = yearDays(ly); if (off < n) break; off -= n; }
    if (ly > 2100) throw new RangeError('日期超出历表范围（至 2100 年）');
    const leap = leapMonth(ly);
    let lm = 1, isLeap = false;
    for (;;) {
      const n = isLeap ? leapDays(ly) : monthDays(ly, lm);
      if (off < n) break;
      off -= n;
      if (!isLeap && leap === lm) isLeap = true; else { isLeap = false; lm++; }
    }
    return { year: ly, month: lm, day: off + 1, isLeap };
  }

  /** 农历 → 公历 */
  function lunarToSolar(ly, lm, ld, isLeap = false) {
    if (ly < 1900 || ly > 2100) throw new RangeError('农历年超出范围（1900–2100）');
    if (isLeap && leapMonth(ly) !== lm) throw new RangeError(`${ly} 年没有闰${MONTH_CN[lm - 1]}月`);
    const maxD = isLeap ? leapDays(ly) : monthDays(ly, lm);
    if (ld < 1 || ld > maxD) throw new RangeError(`该月只有 ${maxD} 天`);
    let off = 0;
    for (let y = 1900; y < ly; y++) off += yearDays(y);
    const leap = leapMonth(ly);
    for (let m = 1; m < lm; m++) { off += monthDays(ly, m); if (leap === m) off += leapDays(ly); }
    if (isLeap) off += monthDays(ly, lm);
    return fromJdn(BASE_JDN + off + ld - 1);
  }

  /* ── 干支 ── */
  const gz = (i) => STEMS[mod(i, 10)] + BRANCHES[mod(i, 12)];
  const yearGzIndex = (y) => mod(y - 4, 60);
  const dayGzIndex = (n) => mod(n + 49, 60);          // n = JDN
  const yinStem = (yearStem) => mod((yearStem % 5) * 2 + 2, 10); // 五虎遁：寅月/寅宫天干
  const ziStem = (dayStem) => mod((dayStem % 5) * 2, 10);         // 五鼠遁：子时天干

  /**
   * 节气四柱（八字）
   * @param jUT 出生瞬间 UT 儒略日
   * @param dayJdn 日柱所用日期（已按子时换日规则处理）
   * @param hourBranch 时支
   */
  function baziPillars(jUT, dayJdn, hourBranch) {
    const g = Astro.fromJd(jUT + 8 / 24);
    let y = g.y;
    if (jUT < Astro.termOfYear(y, 2)) y -= 1;                    // 立春换年
    const yStem = mod(y - 4, 10), yBranch = mod(y - 4, 12);
    // 找最近的「节」（小寒0 立春2 … 大雪22，偶数序）
    let best = null;
    for (const yy of [g.y - 1, g.y]) for (let k = 0; k < 24; k += 2) {
      const t = Astro.termOfYear(yy, k);
      if (t <= jUT && (!best || t > best.t)) best = { t, k };
    }
    const mBranch = mod(best.k / 2 + 1, 12);
    const mStem = mod(yinStem(yStem) + mod(mBranch - 2, 12), 10);
    const dIdx = dayGzIndex(dayJdn);
    const hStem = mod(ziStem(dIdx % 10) + hourBranch, 10);
    return {
      year: STEMS[yStem] + BRANCHES[yBranch],
      month: STEMS[mStem] + BRANCHES[mBranch],
      day: gz(dIdx),
      hour: STEMS[hStem] + BRANCHES[hourBranch],
      jieqi: { name: Astro.TERM_NAMES[best.k], jd: best.t },
    };
  }

  /** 当前所在节气区间（用于展示） */
  function termBefore(jUT) {
    const g = Astro.fromJd(jUT + 8 / 24);
    let best = null;
    for (const yy of [g.y - 1, g.y]) for (let k = 0; k < 24; k++) {
      const t = Astro.termOfYear(yy, k);
      if (t <= jUT && (!best || t > best.t)) best = { t, k, name: Astro.TERM_NAMES[k] };
    }
    return best;
  }

  const lunarText = (l) => `${l.isLeap ? '闰' : ''}${MONTH_CN[l.month - 1]}月${DAY_CN(l.day)}`;

})();

    天梁: { 0: '庙', 1: '旺', 2: '庙', 3: '庙', 4: '旺', 5: '陷', 6: '庙', 7: '旺', 8: '陷', 11: '陷' },

    天同: { 0: '旺', 1: '陷', 2: '平', 3: '庙', 4: '旺', 5: '庙', 8: '旺', 9: '平', 10: '平', 11: '庙' },
    天相: { 0: '庙', 1: '庙', 2: '庙', 3: '陷', 4: '旺', 5: '平', 6: '旺', 7: '平', 10: '陷', 11: '平' },
    天虚: { 7: '陷', 8: '庙', 9: '旺', 10: '陷' }, 天钺: { 5: '庙', 6: '庙', 7: '旺', 8: '庙' },

    武曲: { 0: '旺', 1: '庙', 2: '平', 3: '陷', 4: '庙', 5: '平', 6: '旺', 9: '旺', 10: '庙', 11: '平' },
    咸池: { 0: '陷', 3: '平', 6: '陷', 9: '平' },
    右弼: { 0: '旺', 1: '庙', 2: '旺', 3: '庙', 4: '庙', 5: '旺', 6: '旺', 7: '庙', 8: '旺', 9: '旺', 10: '庙', 11: '旺' },
    月德: { 6: '旺', 7: '平', 8: '陷', 9: '闲' },
    紫微: { 1: '庙', 2: '庙', 3: '旺', 4: '闲', 5: '旺', 6: '庙', 7: '庙', 8: '旺', 9: '平', 10: '陷' },
    左辅: { 0: '旺', 1: '庙', 2: '旺', 3: '庙', 4: '庙', 5: '旺', 6: '旺', 7: '庙', 8: '旺', 9: '旺', 10: '庙', 11: '旺' },
  };
  // 全书通行表（自寅宫起排）
  const B_STD = {
    紫微: '旺旺得旺庙庙旺旺得旺平庙', 天机: '得旺利平庙陷得旺利平庙陷', 太阳: '旺庙旺旺旺得得陷不陷陷不',
    武曲: '得利庙平旺庙得利庙平旺庙', 天同: '利平平庙陷不旺平平庙旺不', 廉贞: '庙平利陷平利庙平利陷平利',
    天府: '庙得庙得旺庙得旺庙得庙庙', 太阴: '旺陷陷陷不不利不旺庙庙庙', 贪狼: '平利庙陷旺庙平利庙陷旺庙',
    巨门: '庙庙陷旺旺不庙庙陷旺旺不', 天相: '庙陷得得庙得庙陷得得庙庙', 天梁: '庙庙庙陷庙旺陷得庙陷庙旺',
    七杀: '庙旺庙平旺庙庙庙庙平旺庙', 破军: '得陷旺平庙旺得陷旺平庙旺',
    文昌: '陷利得庙陷利得庙陷利得庙', 文曲: '平旺得庙陷旺得庙陷旺得庙',
    火星: '庙利陷得庙利陷得庙利陷得', 铃星: '庙利陷得庙利陷得庙利陷得',
    擎羊: '　陷庙　陷庙　陷庙　陷庙', 陀罗: '陷　庙陷　庙陷　庙陷　庙',
  };
  function brightness(name, branch) {
    const w = B_WENMO[name]?.[branch];
    if (w) return w;
    const s = B_STD[name];
    if (!s) return '';
    const c = s[mod(branch - 2, 12)];
    return c === '　' ? '' : c;
  }
  const brightLevel = (b) => (b === '庙' || b === '旺') ? 2 : (b === '陷' || b === '不' || b === '闲') ? 0 : b ? 1 : -1;

  function starType(name) {
    if (MAJOR.includes(name)) return 'major';
    if (LUCKY6.includes(name)) return 'lucky';
    if (SHA6.includes(name)) return 'sha';
    if (name === '禄存' || name === '天马') return 'lu';
    return 'minor';
  }

  /* ══════════ 时间层：钟表时 → 真太阳时 → 时辰 / 换日 / 农历 ══════════ */
  function chinaDST(y, m, d) {
    if (y < 1986 || y > 1991) return false;
    const day = (mm, dd) => mm * 100 + dd;
    const firstSundayFrom = (mm, from) => { for (let dd = from; dd < from + 7; dd++) if (new Date(Date.UTC(y, mm - 1, dd)).getUTCDay() === 0) return dd; return from; };
    let s, e;
    if (y === 1986) { s = day(5, 4); e = day(9, 14); }
    else { s = day(4, firstSundayFrom(4, 11)); e = day(9, firstSundayFrom(9, 11)); }
    const t = day(m, d);
    return t >= s && t < e;
  }

  /**
   * 解析出生时间
   * input: { calendar:'solar'|'lunar', year, month, day, isLeapMonth, timeMode:'clock'|'branch',
   *          hour, minute, branch(0-12, 12=晚子), longitude, tz, dst, trueSolar, eot, lateZiNextDay }
   */
  function resolveTime(input) {
    const warn = [];
    let { year: y, month: m, day: d } = input;
    if (input.calendar === 'lunar') {
      const s = Cal.lunarToSolar(y, m, d, !!input.isLeapMonth);
      ({ y, m, d } = s);
    }
    if (!Cal.isValidSolar(y, m, d)) throw new RangeError('日期无效或超出 1900-01-31 至 2100-12-31 的范围');
    const lon = Number.isFinite(input.longitude) ? input.longitude : 120;
    const tz = Number.isFinite(input.tz) ? input.tz : 8;
    const lateZiNextDay = input.lateZiNextDay !== false;
    const out = { clock: null, solar: null, eotMin: 0, lonMin: 0, dstApplied: false, warnings: warn };

    if (input.timeMode === 'branch') {
      const b = input.branch;
      const isLateZi = b === 12;
      const hb = isLateZi ? 0 : b;
      const midHour = isLateZi ? 23.5 : hb === 0 ? 0.5 : hb * 2;
      const jUT = Astro.jd(y, m, d + midHour / 24) - tz / 24;
      let dayJdn = Cal.jdn(y, m, d);
      if (isLateZi && lateZiNextDay) dayJdn += 1;
      out.mode = 'branch';
      out.hourBranch = hb;
      out.isLateZi = isLateZi;
      out.civil = { y, m, d };
      out.jUT = jUT;
      out.dayJdn = dayJdn;
      out.boundaryMinutes = null;
      return out;
    }

    const hh = input.hour, mi = input.minute || 0;
    let dst = input.dst;
    if (dst === 'auto' || dst === undefined) dst = tz === 8 && chinaDST(y, m, d);
    out.dstApplied = !!dst;
    const clockJ = Astro.jd(y, m, d + (hh + mi / 60) / 24);
    const jUT = clockJ - (tz + (dst ? 1 : 0)) / 24;
    let localJ;
    if (input.trueSolar === false) {
      localJ = clockJ - (dst ? 1 / 24 : 0);
    } else {
      out.lonMin = lon * 4 - tz * 60;                         // 经度时差（分钟）
      out.eotMin = input.eot === false ? 0 : Astro.equationOfTime(jUT);
      localJ = jUT + lon / 15 / 24 + out.eotMin / 1440;
    }
    const L = Astro.fromJd(localJ);
    const ld = Math.floor(L.d);
    let minutes = Math.round((L.d - ld) * 1440);
    let lc = { y: L.y, m: L.m, d: ld };
    if (minutes >= 1440) { minutes -= 1440; lc = Cal.fromJdn(Cal.jdn(lc.y, lc.m, lc.d) + 1); }
    const hb = Math.floor(mod(minutes + 60, 1440) / 120);
    const isLateZi = minutes >= 1380;
    let dayJdn = Cal.jdn(lc.y, lc.m, lc.d);
    if (isLateZi && lateZiNextDay) dayJdn += 1;
    // 距时辰交界的分钟数（交界在奇数整点）
    const toOdd = mod(minutes - 60, 120);
    const boundaryMinutes = Math.min(toOdd, 120 - toOdd);
    if (boundaryMinutes <= 10) warn.push(`校正后时间距时辰交界仅 ${boundaryMinutes} 分钟，出生时间若有误差，时辰可能落在相邻时辰。建议对照相邻时辰的命盘。`);
    if (dst) warn.push('该日期处于中国夏令时期间（1986–1991），已自动减去 1 小时。若出生证明时间已是标准时间，请在高级设置中关闭夏令时。');
    out.mode = 'clock';
    out.clock = { y, m, d, hh, mi };
    out.solar = { y: lc.y, m: lc.m, d: lc.d, minutes };
    out.hourBranch = hb;
    out.isLateZi = isLateZi;
    out.civil = lc;
    out.jUT = jUT;
    out.dayJdn = dayJdn;
    out.boundaryMinutes = boundaryMinutes;
    return out;
  }

  /* ══════════ 起盘 ══════════ */
  function generate(input) {
    const t = resolveTime(input);
    const gender = input.gender === 'female' ? 'female' : 'male';
    const dayDate = Cal.fromJdn(t.dayJdn);
    const lunar = Cal.solarToLunar(dayDate.y, dayDate.m, dayDate.d);
    const warnings = [...t.warnings];

    // 年界：默认正月初一；可选立春
    let ly = lunar.year;
    if (input.yearDivide === 'lichun') {
      const lichun = Astro.termOfYear(dayDate.y, 2);
      ly = t.jUT >= lichun ? dayDate.y : dayDate.y - 1;
    }
    const yStem = mod(ly - 4, 10), yBranch = mod(ly - 4, 12);
    const isYang = yStem % 2 === 0;

    // 闰月处理
    let mNum = lunar.month;
    if (lunar.isLeap) {
      const mode = input.leapMode || 'split';
      if (mode === 'next' || (mode === 'split' && lunar.day > 15)) mNum = mNum % 12 + 1;
      warnings.push(`生于闰${Cal.MONTH_CN[lunar.month - 1]}月${Cal.DAY_CN(lunar.day)}，按「${mode === 'split' ? '前十五日作本月、后十五日作下月' : mode === 'next' ? '闰月作下月' : '闰月作本月'}」以${Cal.MONTH_CN[mNum - 1]}月排盘。`);
    }
    const dNum = lunar.day;
    const h = t.hourBranch;

    // 命身宫
    const ming = mod(2 + (mNum - 1) - h, 12);
    const shen = mod(2 + (mNum - 1) + h, 12);
    const yin = Cal.yinStem(yStem);
    const stemOf = (b) => mod(yin + mod(b - 2, 12), 10);

    // 五行局
    const jz = (() => { for (let i = 0; i < 60; i++) if (i % 10 === stemOf(ming) && i % 12 === ming) return i; return 0; })();
    const nayin = NAYIN.substr(Math.floor(jz / 2) * 3, 3);
    const ju = JU_BY_EL[nayin[2]];

    // 宫位骨架
    const palaces = Array.from({ length: 12 }, (_, b) => ({
      branch: b, stem: stemOf(b), name: PALACES[mod(ming - b, 12)], idx: mod(ming - b, 12),
      stars: [], isMing: b === ming, isShen: b === shen,
    }));
    const put = (name, b, extra = {}) => {
      const br = mod(b, 12);
      palaces[br].stars.push({ name, type: starType(name), bright: brightness(name, br), ...extra });
    };

    // 紫微 / 天府星系
    let x = 0; while ((dNum + x) % ju !== 0) x++;
    const q = (dNum + x) / ju;
    let zw = 2 + q - 1; zw += (x % 2 === 1) ? -x : x;
    zw = mod(zw, 12);
    const tf = mod(4 - zw, 12);
    [['紫微', 0], ['天机', -1], ['太阳', -3], ['武曲', -4], ['天同', -5], ['廉贞', -8]].forEach(([n, o]) => put(n, zw + o));
    [['天府', 0], ['太阴', 1], ['贪狼', 2], ['巨门', 3], ['天相', 4], ['天梁', 5], ['七杀', 6], ['破军', 10]].forEach(([n, o]) => put(n, tf + o));

    // 六吉
    put('左辅', 4 + mNum - 1); put('右弼', 10 - (mNum - 1));
    const wc = mod(10 - h, 12), wq = mod(4 + h, 12);
    put('文昌', wc); put('文曲', wq);
    put('天魁', KUI[yStem]); put('天钺', YUE[yStem]);
    // 禄存羊陀
    const lc = LUCUN[yStem];
    put('禄存', lc); put('擎羊', lc + 1); put('陀罗', lc - 1);
    put('天马', TIANMA(yBranch));
    // 火铃
    const g = SANHE(yBranch);
    const huoStart = [2, 3, 1, 9][g], lingStart = [10, 10, 3, 10][g];
    put('火星', huoStart + h); put('铃星', lingStart + h);
    // 空劫
    put('地空', 11 - h); put('地劫', 11 + h);

    // 杂曜
    const hl = mod(3 - yBranch, 12);
    put('红鸾', hl); put('天喜', hl + 6);
    put('天刑', 9 + mNum - 1); put('天姚', 1 + mNum - 1);
    put('天哭', 6 - yBranch); put('天虚', 6 + yBranch);
    put('龙池', 4 + yBranch); put('凤阁', 10 - yBranch);
    put('孤辰', [2, 2, 5, 5, 5, 8, 8, 8, 11, 11, 11, 2][yBranch]);
    put('寡宿', [10, 10, 1, 1, 1, 4, 4, 4, 7, 7, 7, 10][yBranch]);
    put('华盖', [4, 1, 10, 7][g]); put('咸池', [9, 6, 3, 0][g]);
    put('破碎', [5, 1, 9][yBranch % 3]);
    put('天德', 9 + yBranch); put('月德', 5 + yBranch); put('年解', 10 - yBranch);
    put('天空', yBranch + 1);
    put('天才', ming + yBranch); put('天寿', shen + yBranch);
    put('天官', TIANGUAN[yStem]); put('天福', TIANFU_S[yStem]);
    put('天巫', [5, 8, 2, 11][(mNum - 1) % 4]);
    put('天月', [10, 5, 4, 2, 7, 3, 11, 7, 2, 6, 10, 2][mNum - 1]);
    put('阴煞', [2, 0, 10, 8, 6, 4][(mNum - 1) % 6]);
    put('解神', [8, 8, 10, 10, 0, 0, 2, 2, 4, 4, 6, 6][mNum - 1]);
    const zf = mod(4 + mNum - 1, 12), yb = mod(10 - (mNum - 1), 12);
    put('三台', zf + dNum - 1); put('八座', yb - (dNum - 1));
    put('恩光', wc + dNum - 2); put('天贵', wq + dNum - 2);
    put('台辅', 6 + h); put('封诰', 2 + h);
    put('天伤', ming - 7); put('天使', ming - 5);
    const xunStartBranch = mod((mod(ly - 4, 60)) - (mod(ly - 4, 60) % 10), 12);
    put('旬空', xunStartBranch + 10); put('旬空', xunStartBranch + 11);

    // 生年四化（倪师：四化固定，只取生年干）
    SIHUA[yStem].forEach((n, i) => {
      for (const p of palaces) for (const s of p.stars) if (s.name === n) s.hua = HUA[i];
    });

    // 十二长生 / 博士 / 岁前 / 将前
    const forward = (isYang && gender === 'male') || (!isYang && gender === 'female');
    const csStart = { 2: 8, 3: 11, 4: 5, 5: 8, 6: 2 }[ju];
    for (let i = 0; i < 12; i++) {
      palaces[mod(csStart + (forward ? i : -i), 12)].changsheng = CHANGSHENG[i];
      palaces[mod(lc + (forward ? i : -i), 12)].boshi = BOSHI[i];
      palaces[mod(yBranch + i, 12)].suiqian = SUIQIAN[i];
      palaces[mod([0, 9, 6, 3][g] + i, 12)].jiangqian = JIANGQIAN[i];
    }

    // 大限
    const daxian = [];
    for (let i = 0; i < 12; i++) {
      const b = mod(ming + (forward ? i : -i), 12);
      const start = ju + i * 10;
      palaces[b].daxian = [start, start + 9];
      daxian.push({ index: i, branch: b, stem: palaces[b].stem, start, end: start + 9, natalName: palaces[b].name });
    }
    // 小限
    const xxStart = [10, 7, 4, 1][g];
    for (let a = 1; a <= 12; a++) {
      const b = mod(xxStart + (gender === 'male' ? a - 1 : -(a - 1)), 12);
      palaces[b].xiaoxian = Array.from({ length: 10 }, (_, k) => a + 12 * k);
    }

    // 空宫借对宫
    for (const p of palaces) {
      const major = p.stars.filter((s) => s.type === 'major');
      p.isEmpty = major.length === 0;
      if (p.isEmpty) {
        const opp = palaces[mod(p.branch + 6, 12)];
        p.borrow = { branch: opp.branch, name: opp.name, stars: opp.stars.filter((s) => s.type === 'major').map((s) => s.name) };
      }
    }

    // 排序：主星 → 禄马 → 六吉 → 六煞 → 杂曜
    const order = { major: 0, lu: 1, lucky: 2, sha: 3, minor: 4 };
    const majorOrder = (n) => MAJOR.indexOf(n);
    const minorOrder = (n) => { const i = CORE_MINOR.indexOf(n); return i < 0 ? 99 : i; };
    for (const p of palaces) p.stars.sort((a, b) => (order[a.type] - order[b.type]) || (a.type === 'major' ? majorOrder(a.name) - majorOrder(b.name) : 0) || (a.type === 'minor' ? minorOrder(a.name) - minorOrder(b.name) : 0));

    const bazi = Cal.baziPillars(t.jUT, t.dayJdn, h);
    const lunarPillars = {
      year: STEMS[yStem] + BRANCHES[yBranch],
      month: STEMS[mod(yin + mNum - 1, 10)] + BRANCHES[mod(mNum + 1, 12)],
      day: bazi.day, hour: bazi.hour,
    };
    const douJun = mod(-(mNum - 1) + h, 12); // 子年斗君（流年斗君 = 流年支 + 此偏移）

    return {
      input: { ...input, gender },
      time: t, warnings,
      lunar, lunarYear: ly, yStem, yBranch, isYang, forward,
      monthNum: mNum, dayNum: dNum, hour: h,
      ming, shen, ju, juName: JU_NAME[ju], nayin, ziweiPos: zw, tianfuPos: tf,
      mingZhu: MING_ZHU[ming], shenZhu: SHEN_ZHU[yBranch],
      sihua: SIHUA[yStem].map((n, i) => ({ hua: HUA[i], star: n, branch: palaces.find((p) => p.stars.some((s) => s.name === n)).branch })),
      palaces, daxian, bazi, lunarPillars, douJunOffset: douJun,
    };
  }

  /* ══════════ 运限：大限 / 流年 / 流月 / 流日 ══════════ */
  function flowStars(prefix, stem, branch) {
    const out = [];
    const lu = LUCUN[stem];
    const add = (n, b) => out.push({ name: prefix + n, base: n, branch: mod(b, 12) });
    add('禄', lu); add('羊', lu + 1); add('陀', lu - 1);
    add('魁', KUI[stem]); add('钺', YUE[stem]);
    add('昌', FLOW_CHANG[stem]); add('曲', FLOW_QU[stem]);
    add('马', TIANMA(branch));
    const hl = mod(3 - branch, 12); add('鸾', hl); add('喜', hl + 6);
    return out;
  }
  const namesFrom = (mingBranch) => Array.from({ length: 12 }, (_, b) => PALACES[mod(mingBranch - b, 12)]);
  const huaOfStem = (stem) => SIHUA[stem].map((n, i) => ({ hua: HUA[i], star: n }));

  /** 虚岁对应的大限 */
  const daxianAtAge = (chart, age) => chart.daxian.find((d) => age >= d.start && age <= d.end) || null;

  /**
   * 运限层
   * sel: { decade?: index, year?: lunarYear, month?: 1-12, day?: 1-30 }
   */
  function horoscope(chart, sel) {
    const res = { layers: [] };
    let decade = null;
    if (sel.year != null) {
      const age = sel.year - chart.lunarYear + 1;
      decade = daxianAtAge(chart, age);
      res.age = age;
    }
    if (sel.decade != null && sel.year == null) decade = chart.daxian[sel.decade];
    if (decade) {
      res.decade = {
        ...decade, scope: 'decade', label: '大限', tag: '大',
        names: namesFrom(decade.branch), stars: flowStars('运', decade.stem, decade.branch),
        hua: huaOfStem(decade.stem), gz: STEMS[decade.stem] + BRANCHES[decade.branch],
      };
      res.layers.push(res.decade);
    }
    if (sel.year != null) {
      const ys = mod(sel.year - 4, 10), yb = mod(sel.year - 4, 12);
      const xiaoxian = chart.palaces.find((p) => p.xiaoxian && p.xiaoxian.includes(res.age));
      res.year = {
        scope: 'year', label: '流年', tag: '年', year: sel.year, stem: ys, branch: yb,
        gz: STEMS[ys] + BRANCHES[yb], names: namesFrom(yb), stars: flowStars('流', ys, yb), hua: huaOfStem(ys),
        xiaoxian: xiaoxian ? xiaoxian.branch : null,

    if (S.has('文昌') && S.has('文曲') && !jiaPair(c, c.ming, '文昌', '文曲') && !(has(ming, '文昌') && has(ming, '文曲') && [1, 7].includes(c.ming))) push({ name: has(ming, '文昌') && has(ming, '文曲') ? '昌曲坐命' : '昌曲同会', level: 'good', palaces: ['命宫'], required: ['文昌、文曲同会命宫三方四正'], desc: '才华横溢、口才文笔俱佳，宜从事需要表达与文采的行业；昌曲最忌化忌，文书契约须细心。', src: '《紫微斗数全书》' });
    if (S.has('左辅') && S.has('右弼') && !has(ming, '紫微') && !jiaPair(c, c.ming, '左辅', '右弼')) push({ name: '辅弼同会', level: 'good', palaces: ['命宫'], required: ['左辅、右弼同会命宫三方四正'], desc: '一生贵人不绝、人缘佳，宜领导岗位与团队合作，不宜单打独斗。', src: '《紫微斗数全书》' });
    if (S.has('天魁') && S.has('天钺') && !jiaPair(c, c.ming, '天魁', '天钺')) push({ name: '魁钺同会', level: 'good', palaces: ['命宫'], required: ['天魁、天钺同会命宫三方四正'], desc: '天乙贵人加持，困难时常有得力相助者，宜主动维护人脉。', src: '《紫微斗数全书》' });

    /* ── 警示格 ── */
    if (ming.isEmpty) push({ name: '命无正曜', level: 'neutral', palaces: ['命宫', qian.name], required: [`命宫无主星，借迁移宫${ming.borrow.stars.join('、') || '（亦空）'}安星`], desc: '个性可塑性强、随环境而变，受六亲与外在环境影响较深；一生宜选对环境与伴侣。', src: '《紫微斗数全书》' });
    for (const p of [ming, qian]) {
      const ji = p.stars.find((s) => s.hua === '忌');
      if (ji) push({ name: `${ji.name}化忌${p.isMing ? '坐命' : '入迁'}`, level: 'caution', palaces: [p.name], required: [`${ji.name}化忌在${p.name}`], desc: p.isMing ? `${ji.name}化忌坐命，${ji.name}所代表的特质就是你一生最执着的课题。忌冲迁移，出外较辛苦，宜先修己再求外。` : `${ji.name}化忌在迁移而冲命宫，外出、远行、人际多波折，宜守不宜躁。`, src: '《紫微斗数全书》' });
    }
    if (ming.stars.some((s) => s.hua === '忌') && jiaPair(c, c.ming, '擎羊', '陀罗')) push({ name: '羊陀夹忌', level: 'caution', palaces: ['命宫'], required: ['化忌坐命', '擎羊陀罗夹命'], desc: '古云羊陀夹忌为败局。主劳碌奔波、坎坷不顺；以德行修养与踏实做事化解，凡事谨慎。', src: '《骨髓赋》' });
    else if (jiaPair(c, c.ming, '擎羊', '陀罗')) push({ name: '羊陀夹命', level: 'caution', palaces: ['命宫'], required: ['擎羊陀罗分居命宫前后（禄存坐命）'], desc: '有禄而受羊陀所夹，财禄稳定但易受小人掣肘，宜低调守成。', src: '《紫微斗数全书》' });
    if (jiaPair(c, c.ming, '火星', '铃星')) push({ name: '火铃夹命', level: 'caution', palaces: ['命宫'], required: ['火星铃星分居命宫前后'], desc: '性急易冲动，易有突发意外或纠纷，宜培养耐性、避免冲动决策。', src: '《紫微斗数全书》' });
    if (jiaPair(c, c.ming, '地空', '地劫')) push({ name: '空劫夹命', level: 'caution', palaces: ['命宫'], required: ['地空地劫分居命宫前后'], desc: '财来财去、思想脱俗，宜技艺、宗教、研究等不重物质之业。', src: '《紫微斗数全书》' });
    {
      const luP = where(c, '禄存');
      const huaLuP = c.palaces.find((p) => p.stars.some((s) => s.hua === '禄'));
      const broken = [luP, huaLuP].filter(Boolean).filter((p) => hasAny(p, KONG) || p.stars.some((s) => s.hua === '忌'));
      if (broken.length && broken.some((p) => inSf(c, p.branch))) push({ name: '禄逢冲破', level: 'caution', palaces: [...new Set(broken.map((p) => p.name))], required: ['禄星与空劫或化忌同宫，且在命宫三方四正'], desc: '禄遇冲破，吉处藏凶，得而复失；理财宜保守，不宜作保、借贷与高风险投资。', src: '《紫微斗数全书》' });
    }
    if (S.has('廉贞') && S.has('七杀') && S.has('擎羊')) push({ name: '廉杀羊', level: 'caution', palaces: ['命宫'], required: ['廉贞、七杀、擎羊会照命宫三方'], desc: '古书警示之格，主血光、官非、意外。本命有此组合不必惊慌，运限再触发时宜慎驾驶、避冲突、留意手术风险。', src: '《紫微斗数全书》' });
    if (S.has('巨门') && S.has('火星') && S.has('擎羊')) push({ name: '巨火羊', level: 'caution', palaces: ['命宫'], required: ['巨门、火星、擎羊会照命宫三方'], desc: '易因口舌、激烈冲突而招祸。宜修身养性、慎言慎行，避免极端情绪。', src: '《骨髓赋》' });
    if (S.has('铃星') && S.has('文昌') && S.has('陀罗') && S.has('武曲')) push({ name: '铃昌陀武', level: 'caution', palaces: ['命宫'], required: ['铃星、文昌、陀罗、武曲会照命宫三方'], desc: '古书凶格。本命有此组合不必恐慌，运限触发时宜高度警觉重大决策与情绪起伏。', src: '《骨髓赋》' });
    if (c.ming === 6 && has(ming, '擎羊')) {
      const bonus = [];
      if (S.has('七杀') || S.has('破军')) bonus.push('再会七杀或破军');
      if (S.has('天魁') || S.has('天钺')) bonus.push('魁钺加会');
      push({ name: '马头带箭', level: bonus.length ? 'good' : 'caution', palaces: ['命宫'], required: ['擎羊坐命于午'], bonus, desc: '古云威镇边疆。刚毅果决、有冲杀之力，宜军警、运动、外科；须防危险与意外。', src: '《骨髓赋》' });
    }
    {
      const sun = where(c, '太阳'), moon = where(c, '太阴');
      if (sun && moon && isDim(sun, '太阳') && isDim(moon, '太阴') && inSf(c, sun.branch) && inSf(c, moon.branch)) {
        const rescue = huaIn([sun, moon], '禄') || huaIn([sun, moon], '权') || huaIn([sun, moon], '科');
        push({ name: '日月反背', level: rescue ? 'neutral' : 'caution', palaces: [sun.name, moon.name], required: ['太阳太阴俱落陷且会照命宫三方'], bonus: rescue ? ['日月有吉化，反主奋发'] : [], desc: '日月失辉，劳心劳力、与父母缘薄或聚少离多；能勤奋自立者反能白手成家。', src: '《紫微斗数全书》' });
      }
    }

    const rank = { excellent: 0, good: 1, neutral: 2, caution: 3 };
    return out.sort((a, b) => rank[a.level] - rank[b.level]);
  }

  /* ══════════ 断语组织 ══════════ */
  const comboKey = (names) => {
    if (names.length < 2) return null;
    for (let i = 0; i < names.length; i++) for (let j = 0; j < names.length; j++) if (i !== j && Lore.COMBO[names[i] + names[j]]) return names[i] + names[j];
    return null;
  };

  /** 宫位的主星描述（含借宫） */
  function palaceCore(c, p) {
    const own = majors(p);
    const names = own.length ? own : (p.borrow?.stars || []);
    const borrowed = !own.length;
    const key = comboKey(names);
    return { names, borrowed, comboKey: key, combo: key ? Lore.COMBO[key] : null };
  }

  function mingSummary(c) {
    const ming = P(c, c.ming);
    const core = palaceCore(c, ming);
    let text = '';
    if (core.borrowed) text = `命宫无主星，借对宫${core.names.join('、') || '（亦空）'}论命。` + (core.combo || (core.names[0] ? Lore.STAR[core.names[0]].ming : '')) + '借来的星力量打折，个性更易随环境与人事而变。';
    else text = core.combo || Lore.STAR[core.names[0]].ming;
    const shenP = P(c, c.shen);
    return {
      core, text,
      shen: Lore.SHEN[shenP.name] || `身宫在${shenP.name}。`,
      ju: Lore.JU[c.ju],
      keys: core.names.map((n) => Lore.STAR[n]?.key).filter(Boolean),
    };
  }

  function huaCards(c) {
    return c.sihua.map((h) => {
      const p = P(c, h.branch);
      const opp = P(c, h.branch + 6);
      const s = star(p, h.star);
      return {
        hua: h.hua, star: h.star, palace: p.name, branch: p.branch, bright: s?.bright || '',
        text: Lore.HUA_TEXT[h.hua][p.name],
        clash: h.hua === '忌' ? `忌冲${opp.name}：${Lore.THEME[opp.name]}方面容易感到压力，是化忌的另一面。` : null,
      };
    });
  }

  function palaceDetail(c, branch) {
    const p = P(c, branch);
    const core = palaceCore(c, p);
    const lines = [];
    const sfp = sf(c, branch);
    if (p.isMing) lines.push(mingSummary(c).text);
    else if (core.names.length) {
      const special = Lore.IN_PALACE[p.name];
      const parts = core.names.map((n) => special?.[n] || `${n}（${Lore.STAR[n].key}）入${p.name}，${Lore.THEME[p.name]}带有${Lore.STAR[n].key.split('·')[0]}的色彩。`);
      if (core.borrowed) lines.push(`本宫无主星，借对宫${p.borrow.name}的${core.names.join('、')}来看，力量较弱。`);
      if (core.combo && !p.isMing) lines.push(core.combo);
      lines.push(...parts.filter((x, i, a) => a.indexOf(x) === i));
    } else lines.push('本宫与对宫皆无主星，以吉煞与四化论之。');
    if (p.name === '疾厄') core.names.forEach((n) => lines.push(`${n}属${Lore.STAR[n].wx}，健康上留意${Lore.STAR[n].organ}。`));
    const lucky = p.stars.filter((s) => s.type === 'lucky' || s.type === 'lu').map((s) => `${s.name}${Lore.LUCKY_TEXT[s.name] ? '：' + Lore.LUCKY_TEXT[s.name] : ''}`);
    const sha = p.stars.filter((s) => s.type === 'sha').map((s) => `${s.name}：${Lore.SHA_TEXT[s.name]}`);
    const hua = p.stars.filter((s) => s.hua).map((s) => ({ hua: s.hua, star: s.name, text: Lore.HUA_TEXT[s.hua][p.name] }));
    const oppJi = P(c, branch + 6).stars.find((s) => s.hua === '忌');
    const sfSha = shaCount(sfp, SHA6), sfLucky = sfp.reduce((n, q) => n + q.stars.filter((s) => s.type === 'lucky').length, 0);
    const huaInSf = ['禄', '权', '科', '忌'].filter((h) => huaIn(sfp, h));
    return {
      palace: p, core, read: Lore.READ[p.name], theme: Lore.THEME[p.name], lines, lucky, sha, hua,
      oppJi: oppJi ? `对宫${P(c, branch + 6).name}有${oppJi.name}化忌冲入，${Lore.THEME[p.name]}方面须多一分谨慎。` : null,
      sanfang: sfp.map((q) => ({ name: q.name, branch: q.branch, majors: majors(q) })),
      tally: { sha: sfSha, lucky: sfLucky, hua: huaInSf },
    };
  }

  function tone(c, b) {
    const sfp = sf(c, b);
    let s = 0;
    const self = P(c, b);
    for (const st of self.stars) {
      if (st.hua === '禄') s += 2; if (st.hua === '权' || st.hua === '科') s += 1; if (st.hua === '忌') s -= 2;
      if (st.type === 'lucky' || st.name === '禄存') s += 1; if (st.type === 'sha') s -= 1;
    }
    for (const q of sfp.slice(1)) for (const st of q.stars) {
      if (st.hua === '禄' || st.hua === '权' || st.hua === '科') s += 0.5; if (st.hua === '忌') s -= q.branch === mod(b + 6, 12) ? 1.5 : 0.5;
      if (st.type === 'lucky') s += 0.3; if (st.type === 'sha') s -= 0.4;
    }
    const level = s >= 2 ? '顺' : s <= -1.5 ? '慎' : '平';
    return { score: Math.round(s * 10) / 10, level };
  }

  function decadeReading(c, h) {
    const d = h.decade; if (!d) return null;
    const p = P(c, d.branch);
    const core = palaceCore(c, p);
    const out = [];
    out.push(Lore.DECADE_FOCUS[p.name]);
    if (core.names.length) out.push(`大限命宫${core.borrowed ? '借' : '坐'}${core.names.join('、')}：${core.names.map((n) => Lore.STAR[n].key).join('；')}，这十年做事风格带有此星的色彩。`);
    const natalHua = p.stars.filter((s) => s.hua);
    natalHua.forEach((s) => out.push(`本命${s.name}化${s.hua}在此，${s.hua === '忌' ? '这十年最执着、最费心的也正是这件事，宜正面面对、不宜逃避。' : `这十年得到${Lore.HUA_ESSENCE[s.hua]}的助力。`}`));
    const oppJi = P(c, d.branch + 6).stars.find((s) => s.hua === '忌');
    if (oppJi) out.push(`本命${oppJi.name}化忌在大限迁移宫冲入，这十年外部压力较大，宜稳扎稳打。`);
    const sfp = sf(c, d.branch);
    const sfHua = ['禄', '权', '科'].filter((x) => huaIn(sfp.slice(1), x) && !natalHua.some((s) => s.hua === x));
    if (sfHua.length) out.push(`三方会入本命化${sfHua.join('、化')}，${sfHua.includes('禄') ? '财源与机会可期' : '名声与掌控力有所增长'}。`);
    const shaIn = p.stars.filter((s) => s.type === 'sha').map((s) => s.name);
    if (shaIn.length) out.push(`大限命宫见${shaIn.join('、')}：${shaIn.map((n) => Lore.SHA_TEXT[n]).join('；')}。`);
    const fs = d.stars.filter((s) => s.branch === d.branch && ['运禄', '运羊', '运陀', '运马'].includes(s.name)).map((s) => s.name);
    if (fs.length) out.push(`运曜${fs.join('、')}入大限命宫。`);
    return { title: `${d.start}–${d.end} 岁 · 大限${d.gz}`, palaceName: p.name, lines: out, tone: tone(c, d.branch) };
  }

  function yearReading(c, h) {
    const y = h.year; if (!y) return null;
    const p = P(c, y.branch);
    const core = palaceCore(c, p);
    const out = [];
    out.push(Lore.YEAR_FOCUS[p.name]);
    if (h.decade) out.push(`流年命宫叠大限${h.decade.names[y.branch]}${h.decade.names[y.branch] === '命宫' ? '，大限与流年同步，今年是这十年的关键年' : ''}。`);
    if (core.names.length) out.push(`流年命宫${core.borrowed ? '借' : '坐'}${core.names.join('、')}。`);
    p.stars.filter((s) => s.hua).forEach((s) => out.push(`本命${s.name}化${s.hua}在流年命宫，今年${s.hua === '忌' ? '容易为此事执着烦心，宜放下得失心。' : `${Lore.HUA_ESSENCE[s.hua]}之事较多。`}`));
    const oppJi = P(c, y.branch + 6).stars.find((s) => s.hua === '忌');
    if (oppJi) out.push(`本命化忌在流年迁移冲命，今年外出与人际宜谨慎。`);
    const lu = y.stars.find((s) => s.name === '流禄'), yang = y.stars.find((s) => s.name === '流羊'), tuo = y.stars.find((s) => s.name === '流陀');
    out.push(`流禄在${y.names[lu.branch]}（本命${P(c, lu.branch).name}），今年的进益多从这里来；流羊在${y.names[yang.branch]}、流陀在${y.names[tuo.branch]}，是今年的阻力所在。`);
    if (y.xiaoxian != null) out.push(`小限在本命${P(c, y.xiaoxian).name}。`);
    return { title: `${y.year} ${y.gz}年 · 虚岁 ${h.age}`, palaceName: p.name, lines: out, tone: tone(c, y.branch) };
  }

  function health(c) {
    const ji = P(c, c.palaces.find((p) => p.name === '疾厄').branch);
    const core = palaceCore(c, ji);
    const lines = [];
    const ju = Lore.JU[c.ju];
    lines.push({ k: '五行局', v: `${c.juName}（${c.nayin}）。${ju.text}` });
    if (core.names.length) lines.push({ k: '疾厄主星', v: core.names.map((n) => `${n}（${Lore.STAR[n].wx}）：留意${Lore.STAR[n].organ}`).join('；') + (core.borrowed ? '（借对宫星，力量较弱）' : '') + '。' });
    const shaIn = ji.stars.filter((s) => s.type === 'sha');
    if (shaIn.length) lines.push({ k: '疾厄见煞', v: shaIn.map((s) => `${s.name}主${Lore.SHA_HEALTH[s.name]}`).join('；') + '。' });
    const jiStar = c.sihua.find((x) => x.hua === '忌');
    const jiWx = (Lore.STAR[jiStar.star]?.wx || (jiStar.star === '文昌' ? '阳金' : jiStar.star === '文曲' ? '阴水' : '')).slice(-1);
    if (jiWx) lines.push({ k: '化忌之星', v: `生年${jiStar.star}化忌，${jiStar.star}五行属${jiWx}，对应${Lore.ORGAN[jiWx]}，是一生需要长期照顾的系统。` });
    const huaJi = ji.stars.filter((s) => s.hua);
    huaJi.forEach((s) => lines.push({ k: `化${s.hua}在疾厄`, v: Lore.HUA_TEXT[s.hua]['疾厄'] }));
    const mingCore = palaceCore(c, P(c, c.ming));
    if (mingCore.names[0]) lines.push({ k: '命宫本气', v: `命宫${mingCore.names.join('、')}，本气属${mingCore.names.map((n) => Lore.STAR[n].wx).join('、')}；个性与体质互为表里，情绪失衡时先伤${Lore.ORGAN[Lore.STAR[mingCore.names[0]].wx.slice(-1)].split('、')[0]}。` });
    return { palace: ji, lines };
  }

  /** 给 AI 的命盘文本 */
  function chartText(c, h, patterns) {
    const L = [];
    const t = c.time;
    const inp = c.input;
    L.push(`【基本】${inp.name || '命主'}，${c.isYang ? '阳' : '阴'}${inp.gender === 'male' ? '男' : '女'}，${Cal.gz(c.lunarYear - 4)}年${Cal.lunarText(c.lunar)} ${ZW.HOURS[c.hour]}时；${c.juName}（${c.nayin}）；命主${c.mingZhu}，身主${c.shenZhu}；命宫${BRANCHES[c.ming]}，身宫${BRANCHES[c.shen]}（在${P(c, c.shen).name}）。`);
    L.push(`【八字】${c.bazi.year} ${c.bazi.month} ${c.bazi.day} ${c.bazi.hour}`);
    L.push(`【生年四化】${c.sihua.map((x) => `${x.star}化${x.hua}在${P(c, x.branch).name}`).join('；')}`);
    L.push('【十二宫】');
    for (let i = 0; i < 12; i++) {
      const p = P(c, c.ming - i);
      const stars = p.stars.filter((s) => s.type !== 'minor' || ZW.CORE_MINOR.includes(s.name)).map((s) => `${s.name}${s.bright ? '(' + s.bright + ')' : ''}${s.hua ? '化' + s.hua : ''}`).join('、') || '无';
      L.push(`${p.name}（${STEMS[p.stem]}${BRANCHES[p.branch]}，大限${p.daxian[0]}-${p.daxian[1]}${p.isShen ? '，身宫' : ''}）：${stars}${p.isEmpty ? `；空宫借对宫${p.borrow.stars.join('、')}` : ''}`);
    }
    if (patterns.length) L.push(`【格局】${patterns.map((x) => `${x.name}${x.breaking?.length ? '（破：' + x.breaking.join('，') + '）' : ''}`).join('；')}`);
    if (h?.decade) L.push(`【当前大限】${h.decade.start}-${h.decade.end}岁，大限命宫在本命${P(c, h.decade.branch).name}（${h.decade.gz}）`);
    if (h?.year) L.push(`【流年】${h.year.year}年${h.year.gz}，虚岁${h.age}，流年命宫在本命${P(c, h.year.branch).name}，叠大限${h.decade?.names[h.year.branch] || ''}`);
    return L.join('\n');
  }

  return { detectPatterns, mingSummary, huaCards, palaceDetail, decadeReading, yearReading, health, chartText, palaceCore, tone, sf };
})();
